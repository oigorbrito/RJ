name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RJ_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=rj_test;Username=postgres;Password=postgres
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: rj_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rj_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore RJ.slnx
      - name: Build
        run: dotnet build RJ.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test RJ.slnx --configuration Release --no-build
