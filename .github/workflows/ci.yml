name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore RJ.slnx
      - name: Build
        run: dotnet build RJ.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test RJ.slnx --configuration Release --no-build --logger "trx;LogFileName=tests.trx"
